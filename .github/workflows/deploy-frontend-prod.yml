# Deploy Frontend a Producción
name: Deploy Frontend to Production

on:
  push:
    branches:
      - main  # Solo deploys desde main

  workflow_dispatch:  # Permite deploy manual desde UI

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

permissions:
  id-token: write  # Requerido para OIDC
  contents: read

jobs:
  deploy:
    name: Build and Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build producción
        run: npm run build
        env:
          # Agregar env vars necesarias para el build
          # VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NODE_ENV: production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FRONTEND }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Frontend-Deploy

      - name: Obtener configuración desde Terraform outputs
        id: get-config
        run: |
          # Estos valores vendrán de los outputs de Terraform
          # Por ahora usar secrets de GitHub
          echo "bucket=${{ secrets.S3_BUCKET_FRONTEND }}" >> $GITHUB_OUTPUT
          echo "distribution-id=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.get-config.outputs.bucket }}/ \
            --delete \
            --cache-control "max-age=31536000,public,immutable" \
            --exclude "index.html" \
            --exclude "*.map"

          # index.html sin cache (siempre fresh)
          aws s3 cp dist/index.html s3://${{ steps.get-config.outputs.bucket }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.get-config.outputs.distribution-id }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "📦 S3 Bucket: ${{ steps.get-config.outputs.bucket }}"
          echo "🌐 CloudFront Distribution: ${{ steps.get-config.outputs.distribution-id }}"
          echo "🔗 URL: https://${{ secrets.FRONTEND_DOMAIN }}"
